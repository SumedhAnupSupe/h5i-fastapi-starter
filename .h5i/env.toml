# Convenient browser workflow: the box uses the host network and the
# FastAPI service can be reached at http://localhost:8000.
[profile.fastapi-dev]
isolation = "process"

[profile.fastapi-dev.net]
mode = "host"

[service.api]
command = ".venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"
port = 8000

# Scoped workflow: package installation can reach PyPI, while the running
# server remains inside the supervised box network namespace. Use
# `h5i box share` to expose port 8000 to a browser.
[profile.fastapi]
isolation = "supervised"

[profile.fastapi.net]
mode = "deny"
egress = ["pypi.org", "files.pythonhosted.org"]
